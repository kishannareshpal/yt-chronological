name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The release tag (v1.2.3) is the version, so the manifest always matches the release.
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3, because browsers only accept numeric versions."
            exit 1
          fi
          npm pkg set version="$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Package
        run: |
          (cd dist/chrome && zip -qr "$GITHUB_WORKSPACE/oldest-first-chrome-$VERSION.zip" .)
          (cd dist/firefox && zip -qr "$GITHUB_WORKSPACE/oldest-first-firefox-$VERSION.zip" .)

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" oldest-first-*.zip --clobber
