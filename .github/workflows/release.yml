name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The release tag (2026.10.07.1) is the version, so the manifest always matches the release.
      # The build drops leading zeros for the manifest and fails on tags browsers would reject.
      - name: Set version from tag
        run: |
          node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.version = process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')" "$GITHUB_REF_NAME"
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Package
        run: |
          (cd dist/chrome && zip -qr "$GITHUB_WORKSPACE/yt-chronological-chrome-$VERSION.zip" .)
          (cd dist/firefox && zip -qr "$GITHUB_WORKSPACE/yt-chronological-firefox-$VERSION.zip" .)

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" yt-chronological-*.zip --clobber
